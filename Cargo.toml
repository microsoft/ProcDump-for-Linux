[workspace]
members = [
    "crates/procdump",
    "crates/procdump-capi",
    "crates/procdump-cli",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
libc = "0.2.177"
signal-hook = "0.3.18"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
